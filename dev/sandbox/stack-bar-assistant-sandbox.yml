services:
  ba-sandbox:
    image: bar-assistant:flavor-sandbox
    container_name: bar-assistant-flavor-sandbox
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      - APP_URL=http://192.168.1.64:3002
      - APP_KEY=base64:abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJK=
      - DB_CONNECTION=sqlite
      - DB_FOREIGN_KEYS=true
      - SCOUT_DRIVER=null
      - CACHE_DRIVER=file
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - LOG_OUTPUT_LEVEL=info
    volumes:
      - /volume1/Docker/bar-assistant-sandbox/storage:/var/www/cocktails/storage/bar-assistant
